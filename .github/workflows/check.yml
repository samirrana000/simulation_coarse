name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check (recursive, .js AND .mjs)
        # The old `node --check src/*.js src/physics/*.js` was a no-op:
        # `node --check` takes ONE file and ignores the rest, so only
        # src/analysis-panel.js was ever checked (1 of 67 modules).
        # It then missed every subdirectory, and then missed .mjs entirely —
        # 14 node-run modules (all scripts/validate_*.mjs, scripts/test_*.mjs
        # and evolve/evolve.mjs) were never syntax-checked at all.
        # scripts/check.sh now walks src/ scripts/ tests/ bench/ evolve/ plus
        # the repo root, for both extensions, prints per-extension counts, and
        # fails if any extension's file set is empty.
        run: npm run check
      - name: Unit tests (FAST tier)
        # No `|| node tests/test_all.js` fallback — that swallowed every
        # npm test failure (including "no package.json") and made the step
        # unable to go red.
        run: npm test
      - name: GB finite-difference test
        run: node tests/test_gb_fd.js
      - name: Forces finite-difference test
        run: node tests/test_forces_fd.js
      - name: DOM contract (ui.js ids subset of index.html)
        # wiki pattern P6: Node gates are blind to the DOM. src/ui.js can
        # reference an id that index.html never declares and every Node test
        # still passes — this step is the only thing that catches it.
        run: node scripts/wikiskill_gate.js
      - name: Evolution gate (evolve/evolve.mjs)
        # Runs the FAST suite again plus the weighted score (syntax + tests +
        # DOM contract + bloat/science). Guarded by an existence test so a
        # checkout without evolve/ does not fail the build.
        run: |
          if [ -f evolve/evolve.mjs ]; then
            node evolve/evolve.mjs gate
          else
            echo "evolve/evolve.mjs absent — skipping evolution gate (npm test already covered)"
          fi
      - name: Performance budget (J99 — CI warn, not fail)
        # CI budget warn: compares bench/perf.js meanMs vs bench/budget.json (heavy_compute_ms 2.0, cg_compute_ms 0.5, fps 30) and emits ::warning if exceeded
        run: |
          node bench/perf.js | tee /tmp/perf.log
          python3 - << 'PY' || true
          import json, re, pathlib
          b=json.loads(pathlib.Path("bench/budget.json").read_text())
          t=pathlib.Path("/tmp/perf.log").read_text()
          import re as _re
          cg=_re.search(r"CG:[^\n]*?(\d+\.\d+)\s*±", t)
          hv=_re.search(r"Heavy:[^\n]*?(\d+\.\d+)\s*±", t)
          cg_ms=float(cg.group(1)) if cg else 999
          hv_ms=float(hv.group(1)) if hv else 999
          # CI warn comment: budget is {"heavy_compute_ms":2.0,"fps":30,"cg_compute_ms":0.5} (bench/budget.json:1)
          if cg_ms > b.get("cg_compute_ms", 0.5):
              print(f"::warning :: CG compute {cg_ms:.3f} ms exceeds budget {b['cg_compute_ms']} ms")
          if hv_ms > b.get("heavy_compute_ms", 2.0):
              print(f"::warning :: Heavy compute {hv_ms:.3f} ms exceeds budget {b['heavy_compute_ms']} ms")
          else:
              print(f"Budget OK: CG {cg_ms:.3f} ≤ {b['cg_compute_ms']}, Heavy {hv_ms:.3f} ≤ {b['heavy_compute_ms']}, fps budget {b['fps']}")
          PY
